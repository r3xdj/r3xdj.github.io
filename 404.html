<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        // 設定你 Cloudflare Pages 的新網址 (結尾不要加斜線)
        var newDomain = "https://r3xdj.pages.dev";
        
        // 取得舊網址後面的路徑與參數 (例如 /posts/hello.html?lang=zh)
        var currentPath = window.location.pathname + window.location.search + window.location.hash;
        
        // 執行跳轉
        window.location.replace(newDomain + currentPath);
    </script>
</head>
<body>
    <p>頁面已搬移，正在幫您自動導向至新站點...</p>
</body>
</html>
